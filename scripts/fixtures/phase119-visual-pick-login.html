<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phase 119 Visual Mapping synthetic login</title>
  </head>
  <body>
    <h1>Visual pick fixture</h1>
    <form id="login-form" action="/auth" method="post">
      <label for="visual-user">Username</label>
      <input id="visual-user" name="username" type="text" autocomplete="username" />
      <label for="visual-pass">Password</label>
      <input id="visual-pass" name="password" type="password" autocomplete="current-password" />
      <button type="submit" id="visual-submit">Sign in</button>
    </form>
  </body>
</html>
